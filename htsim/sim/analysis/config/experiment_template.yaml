# 实验配置模板
# 配置分为三个主要部分：common（通用配置）、traffic（流量生成配置）和experiments（模拟执行配置）

# 通用配置，适用于流量生成和模拟执行
common:
  # 网络拓扑参数
  nodes: 16  # 节点数量
  topo: ft  # 拓扑类型：ft (FatTree)
  k: 4      # FatTree的k值
  
  # 通用随机种子
  seed: 0
  
  # 模拟时间参数
  simtime: 5.0  # 模拟时间（秒）

# 流量生成配置
# 这部分参数用于生成连接矩阵文件(CM)
traffic:
  type: permutation  # 流量类型：permutation, incast, outcast_incast, allreduce, serial_alltoall等
  
  # 流量生成参数（根据流量类型不同，参数也不同）
  nodes: 16          # 节点数量（可覆盖common中的值）
  conns: 16          # 连接数量
  flowsize: "2MB"    # 流大小
  extrastarttime: 0  # 额外开始时间
  randseed: 0        # 随机种子（可覆盖common中的值）
  
  # 以下是特定流量类型的额外参数示例
  # groupsize: 16    # 组大小（用于allreduce, serial_alltoall等）
  # parallel: 1      # 并行度（用于serialn_alltoall等）
  # locality: 0      # 局部性（用于allreduce等）
  # conns_incast: 8  # 入聚流连接数（用于outcast_incast）
  # conns_outcast: 8 # 出聚流连接数（用于outcast_incast）

# 模拟执行配置
# 这部分参数用于运行模拟器
experiments:
  - name: ndp_experiment  # 实验名称
    exe: htsim_ndp        # 执行程序
    protocol: ndp         # 协议类型
    
    # 模拟执行特定参数
    extra:
      spray: 1            # 喷射模式
      ecn: 1              # ECN标记
      
    # 可变参数，用于批量实验
    vary:
      trim:               # 修剪参数
        - 0
        - 1
      ecnthresh:          # ECN阈值
        - 10
        - 30
        - 50

  - name: tcp_experiment  # 另一个实验
    exe: htsim_tcp        # 执行程序
    protocol: tcp         # 协议类型
    
    # 模拟执行特定参数
    extra:
      ecn: 1              # ECN标记
      
    # 可变参数
    vary:
      ecnthresh:          # ECN阈值
        - 10
        - 30
        - 50