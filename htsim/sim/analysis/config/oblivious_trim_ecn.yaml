common:
  execute: True
  traffic:
    type: permutation
    params:
      nodes: 16
      conns: 16
      flowsize: "2MB" # 修正为字符串，与 README 示例一致
      extrastarttime: 0
      randseed: 13
  simulation:
    log: sink
    linkspeed: 100000
    nodes: 16
    conns: 16
    cwnd: 50
    mtu: 4000
    end: 300
    logtime: 0.01

experiments:
  - name: oblivious_trim_ecn_ecmp
    exe: htsim_ndp
    protocol: ndp # 添加 protocol 字段
    simulation:
      strat: ecmp
      paths: [256, 32]
      q: [1000, 35]
  - name: oblivious_trim_ecn_ecn
    exe: htsim_ndp
    protocol: ndp # 添加 protocol 字段
    simulation:
      strat: ecmp_host_ecn
      paths: [256, 32]
      q: [1000] # 对于 ecmp_host_ecn，q 仅为 1000
      ecn_thresh: [0.018]
