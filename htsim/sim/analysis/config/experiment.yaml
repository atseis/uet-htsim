# 统一实验配置（重构版）
# 结构说明：
# - common: 顶层通用参数；其中 traffic/simulation 可提供默认值（会被每个 experiment 合并和覆盖）
# - experiments: 每个实验包含 traffic 和 simulation 两部分；两者内参数的任意 list 都会被展开为组合
# - 展开后的每个组合：先用 traffic 参数生成 TMFILE，再用 simulation 参数+TMFILE 执行模拟

common:
  # 通用网络/实验参数（会作为仿真 flags 传入）
  nodes: 8192
  k: 4
  seed: 0
  simtime: 5.0

  # 公共流量默认（可被实验覆盖）
  traffic:
    type: permutation
    params:
      conns: 16
      flowsize: "2MB"
      extrastarttime: 0

  # 公共仿真默认（可被实验覆盖）
  simulation:
    # 在这里放置会被所有实验继承的默认仿真参数，例如：
    mtu: 4000
    end: 300
    logtime: 0.01

experiments:
  - name: ndp_ecmp
    exe: htsim_ndp
    protocol: ndp
    traffic:
      type: permutation
      params:
        # 实验特定的流量参数覆盖或扩展（列表将被展开）
        conns: [16]
        flowsize: ["2MB"]
    simulation:
      strat: ecmp
      # 列表参数将被展开组合
      paths: [32, 256]
      queue_size: [35, 1000]
      cwnd: 50

  - name: ndp_ecn
    exe: htsim_ndp
    protocol: ndp
    traffic:
      type: permutation
      params:
        conns: [16]
        flowsize: ["2MB"]
    simulation:
      strat: ecmp_host_ecn
      paths: [32, 256]
      queue_size: [1000]
      ecn_thresh: [0.018]
      cwnd: 50

