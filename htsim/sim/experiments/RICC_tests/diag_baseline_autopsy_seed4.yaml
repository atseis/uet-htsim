# 文件: configs/diag_baseline_stability.yaml
# 目标: 扫描 20 个种子，寻找 conns=64 时的 Max FCT 崩溃点
common:
  execute: True
  traffic:
    type: incast
    nodes: 432
    flowsize: "50KB"
    extrastarttime: 0    # 绝对同步 (Worst Case)
    prefer_remote: 1     # 强制跨机架
    # randseed: 这里不写，由下面的 list 覆盖

  simulation:
    tiers: 3
    linkspeed: 100000
    mtu: 4150
    hop_latency: 1
    switch_latency: 0
    strat: ecmp_host
    load_balancing_algo: mixed
    paths: 64
    logtime: 0.01
    end: 2000
    log:
      - sink
      - flow_events
      - tor_downqueue
      - nic
      - traffic
    debug: " "

experiments:
  - name: debug_seed4_autopsy
    exe: htsim_uec
    protocol: uec
    
    traffic:
      conns: [64] 
      randseed: [4]

    simulation:
      sender_cc_algo: nscc
      target_q_delay: 12
      queue_size_bdp_factor: 8
      queue_type: composite
      ecn: "20 80"
