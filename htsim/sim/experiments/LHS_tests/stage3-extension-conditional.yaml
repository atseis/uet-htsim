# 阶段 3: 扩展与条件测试
# 目标：探索边缘场景，如故障或 AR
# 维度：10-12，样本数：300

common:
  execute: True
  traffic:
    type: incast
    nodes: 432
    flowsize: "50KB"
    extrastarttime: 0
    prefer_remote: 1
    conns: 64
    randseed: 456


  simulation:
    switch_latency: 0
    logtime: 0.1
    end: 20000
    seed: 456
    log:
      - flow_events
      - queue_usage
    # 固定参数（基于前阶段结果）
    disable_trim: false
    sender_cc_algo: nscc

experiments:
  - name: stage3_extension
    exe: htsim_uec
    protocol: uec

    sampling:
      method: lhs
      samples: 300
      seed: 456
      continuous: [queue_size_bdp_factor, ecn_low, ecn_high, cwnd, hop_latency, target_q_delay, failed, paths]

    simulation:
      # 2. 算法参数（LHS 采样 - 核心变量）
      queue_size_bdp_factor: [0.5, 5.0]
      ecn_low: [0.1, 0.3]
      ecn_high: [0.4, 0.8]
      cwnd: [10, 200]
      hop_latency: [0.1, 2.0]
      target_q_delay: [1.0, 10.0]
      
      # 1. 物理环境（固定 - 条件切片）
      linkspeed: 400000                        # Fixed: 400Gbps
      flowsize: 1000000                        # Fixed: 1MB
      mtu: 4150                                # Fixed: Standard ROCE MTU
      
      # 新增连续变量（整数）
      failed: [0, 5]                            # 失败链接数（整数）
      paths: [16, 128]                          # 路径熵大小（整数）
      
      
      # 固定离散变量（基于前阶段结果）
      queue_type: composite_ecn
      strat: ecmp_host_ecn
      load_balancing_algo: mixed
      sleek: [False, True]
      
      # 条件变量：如果启用 trim，则采样 trimsize
      # 注意：当前 disable_trim=false，所以 trimsize 可用
      trimsize: [64, 1024]                     # trim 大小 (bytes)
