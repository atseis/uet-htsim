# 阶段 1: 初步筛选（核心变量探索）
# 目标：获得整体参数敏感性，识别主效应和交互（如 queuesize 与 ECN 的交互）
# 维度：6-8，样本数：150

common:
  execute: True
  traffic:
    type: incast
    nodes: 432
    flowsize: "50KB"
    extrastarttime: 0
    prefer_remote: 1
    conns: 64  # 固定连接数，聚焦核心参数
    randseed: 13
    # flowsize 由 LHS 采样覆盖，这里虽然保留但不作为单一固定值

  simulation:
    tiers: 3
    planes: 1
    mtu: 4150
    switch_latency: 0
    logtime: 0.1
    end: 2000000
    seed: 13
    log:
      - flow_events
      - sink
    # 固定参数
    disable_trim: false
    sender_cc_algo: nscc
    load_balancing_algo: mixed

experiments:
  - name: stage1_core
    exe: htsim_uec
    protocol: uec

    sampling:
      method: lhs
      samples: 150
      seed: 42
      continuous: [queue_size_bdp_factor, ecn_low, ecn_high, cwnd, hop_latency, linkspeed]
      log_continuous: [flowsize]

    simulation:
      # 核心连续变量（LHS 采样）
      queue_size_bdp_factor: [0.5, 5.0]      # 相对 BDP 的队列大小因子 (LLM: 浅缓冲)
      ecn_low: [0.1, 0.3]                      # ECN 低阈值（相对 queuesize 比例）
      ecn_high: [0.4, 0.8]                     # ECN 高阈值（相对 queuesize 比例）
      cwnd: [10, 200]                          # 初始拥塞窗口 (LLM: 覆盖大流量与突发)
      hop_latency: [0.1, 2.0]                  # 每跳延迟 (us) (LLM: 低延迟)
      linkspeed: [25000, 400000]               # 链路速度 (Mbps, 25-400Gbps)
      flowsize: [10000, 5000000]               # 流大小 (Bytes, 10KB-5MB) 适配 LLM 推理场景 (Activations/Gradients)
      
      # 离散变量（与 LHS 做笛卡尔积）
      queue_type: [composite_ecn, aeolus_ecn] # 聚焦 ECN 支持 lossless
      strat: [ecmp_host_ecn, reactive_ecn, ecmp_ar] # 聚焦 ECN 与 AR
