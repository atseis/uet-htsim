# 文件: configs/stage4_robustness_scan.yaml
# 目标: 靶向 LHS 扫描，验证 ECN=0.05 解的鲁棒性边界
# 重点: 针对 User 质疑的 "queue=8.0" 和 "target=12" 进行压力测试

header:
  mode: lhs     # 开启 LHS 采样
  num_samples: 200 # 样本数，足够绘制响应面

common:
  traffic:
    type: incast
    nodes: 432
    flowsize: "50KB" # 固定为微突发典型值
    prefer_remote: 1
    
  simulation:
    tiers: 3
    linkspeed: 100000
    mtu: 4150
    strat: ecmp_host
    load_balancing_algo: mixed
    paths: 64
    logtime: 0.1
    end: 2000
    log:
      - sink
      - queue_usage  # 必须监控队列，看是否物理溢出

experiments:
  - name: robustness_scan
    exe: htsim_uec
    protocol: uec
    
    traffic:
      # [压力变量]
      # 扫描 Incast 规模，看是否在这个 ECN 下会崩
      conns: {min: 32, max: 128, dist: uniform} 
      
      # [环境干扰]
      # 模拟不同时刻的网络负载
      # 注意：Incast 本身不含 background load，这里可能需要用 injection_rate 或 gap 控制负载
      # 但 Incast 场景通常是 full speed burst。
      # 我们先扫描 load (gap) 虽不完全准确但能模拟稀疏度。
      # 暂不使用 load 变量，而是专注物理约束。
      
    simulation:
      queue_type: composite
      sender_cc_algo: nscc
      sleek: [False] # 关闭 Sleek，只测 ECN 纯解的鲁棒性
      
      # [核心质疑点 1: 物理 Buffer]
      # User 指出之前用的是 8.0 BDP (无限大)。
      # 真实 ToR 只有 10MB-20MB，对于 400G 来说可能只有 1.0-2.0 BDP。
      # 我们必须扫描 "死亡禁区" < 1.0
      queue_size_bdp_factor: {min: 0.5, max: 4.0, dist: log_uniform}
      
      # [核心质疑点 2: 目标延迟]
      # 之前固定为 12us。
      target_q_delay: {min: 5.0, max: 25.0, dist: uniform}
      
      # [优化变量: ECN]
      # 我们围绕 "甜点" 0.05 / 0.2 进行扰动扫描
      # 看看这个盆地到底有多宽
      ecn_low: {min: 0.01, max: 0.15, dist: uniform}
      ecn_high: {min: 0.2, max: 1.0, dist: uniform} # High 必须 >= Low，代码层通常会自动 handle 或我们需约束
      
      # 注意: LHS 引擎通常独立采样。
      # 如果 ECN Low > High 会导致逻辑错误。
      # 在 batch.py 分析时我们可以 filter 掉 invalids，或在 cpp 里有保护。
      # 假设 C++ 代码有 std::max(low, high) 保护。
