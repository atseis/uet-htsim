common:
  execute: True
  traffic:
    type: permutation
    nodes: 16
    conns: 16
    extrastarttime: 0
    randseed: 13
  simulation:
    log: 
      - sink
      - flow_events
    linkspeed: 100000
    cwnd: 50
    mtu: 4000
    end: 300
    logtime: 0.01

experiments:
  - name: oblivious_trim_ecn_ecmp
    exe: htsim_ndp
    protocol: ndp # 添加 protocol 字段
    simulation:
      strat: ecmp
      params:
        - {paths: 256, q: 100}
        - {paths: 32, q: 35}
    traffic:
      params:
        - 
          - {flowsize: "2MB"}
          - {flowsize: "128KB"}
  - name: oblivious_trim_ecn_ecn
    exe: htsim_ndp
    protocol: ndp # 添加 protocol 字段
    simulation:
      strat: ecmp_host_ecn
      paths: [256, 32]
      q: [1000] # 对于 ecmp_host_ecn，q 仅为 1000
      ecn_thresh: [0.018]
plots:
  - CDF-FCT
