common:
  execute: True
  traffic:
    nodes: 16
    conns: 16
    flowsize: "2MB" # 修正为字符串，与 README 示例一致
    extrastarttime: 0
    randseed: 13
  simulation:
    log: 
      - sink
      - flow_events
    linkspeed: 100000
    cwnd: 50
    mtu: 4000
    end: 300
    logtime: 0.01

experiments:
  - name: oblivious_trim_ecn_ecmp
    exe: htsim_ndp
    protocol: ndp # 添加 protocol 字段
    simulation:
      strat: ecmp
      paths: [256]
      q: [1000]
    traffic:
      params:
        - 
          - {"type":"incast","nodes":128,"conns":64,"flowsize":100KB,"extrastarttime":0,"randseed":42,"prefer_remote":0}
          - {"type":"permutation","nodes":128,"conns":128,"flowsize":200KB,"extrastarttime":0,"randseed":42}
          - {"type":"outcast_incast","nodes":128,"conns_incast":8,"conns_outcast":4,"flowsize":100KB,"randseed":42}
          - {"type":"allreduce","nodes":128,"conns":128,"groupsize":128,"flowsize":1MB,"randseed":42}
          - {"type":"allreduce_butterfly","nodes":128,"conns":1,"groupsize":128,"flowsize":1MB,"randseed":42}
          - {"type":"serial_alltoall","nodes":128,"conns":128,"groupsize":8,"flowsize":1MB,"extrastarttime":0,"randseed":42}
          - {"type":"serialn_alltoall","nodes":128,"conns":128,"groupsize":128,"parallel":2,"flowsize":1MB,"extrastarttime":0,"randseed":42}
          - {"type":"serialn_alltoall_prio","nodes":128,"conns":128,"groupsize":128,"parallel":2,"flowsize":1MB,"extrastarttime":0,"randseed":42}
plots:
  - CDF-FCT
