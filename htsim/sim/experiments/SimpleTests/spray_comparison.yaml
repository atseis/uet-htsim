common:
  execute: True
  traffic:
    type: permutation
    flowsize: "2MB"
  simulation:
    log:
      - sink
      - flow_events
    linkspeed: 100000
    q: 35
    cwnd: 50
    mtu: 4000
    end: 1500
    strat: ecmp

experiments:
  - name: spray_comparison
    exe: htsim_ndp
    protocol: ndp
    traffic:
      randseed: [13]
      params:
        - 
          - {nodes: 432, conns: 432}
          - {nodes: 1024, conns: 1024}
    simulation:
      paths: [1,8,16]
      
plots:
  - AvgFCT-Nodes